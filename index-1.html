<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>To-Do List</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:25px;
    width:300px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
}

form{
    display:flex;
    gap:5px;
}

input{
    flex:1;
    padding:8px;
    border-radius:5px;
    border:1px solid #ccc;
}

button{
    padding:8px 12px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#45a049;
}

ul{
    margin-top:15px;
    padding:0;
}

li{
    list-style:none;
    padding:8px;
    background:#eee;
    margin-top:5px;
    border-radius:5px;
}
</style>
</head>

<body>

<div class="container">

<h2>My To-Do List</h2>

<form id="todoForm">
<input type="text" id="taskInput" placeholder="Enter a task">
<button type="submit">Add</button>
</form>

<ul id="taskList"></ul>

</div>

<script>

let form = document.getElementById("todoForm");
let input = document.getElementById("taskInput");
let list = document.getElementById("taskList");

form.addEventListener("submit", function(event){

event.preventDefault();

let task = input.value;

if(task !== ""){

let li = document.createElement("li");
li.textContent = task;

list.appendChild(li);

input.value = "";

}

});

</script>

</body>
</html>
